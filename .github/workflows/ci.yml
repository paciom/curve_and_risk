name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Restore fails on any known-vulnerable package, direct or transitive (NuGetAudit).
      - name: Restore
        run: dotnet restore CurveRisk.slnx

      # The same command developers and the agent run locally: formatting, size limits, build with
      # every analyzer finding as an error, tests, coverage thresholds, guard-rail tests.
      - name: Quality gate
        run: node tools/check.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: "**/TestResults/coverage.cobertura.xml"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
