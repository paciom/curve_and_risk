name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      # Lifecycle scripts are off: the lint tooling needs none, and a compromised package could use one.
      - name: Install lint tooling
        run: npm ci --ignore-scripts

      # Fails on any known-vulnerable package, direct or transitive (NuGetAudit).
      - name: Restore
        run: dotnet restore CurveRisk.slnx

      # The same command developers and the agent run locally. See docs/quality-gates.md.
      - name: Quality gate
        run: node tools/check.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage
          path: "TestResults/*.cobertura.xml"

  # The API tests again, against the database used in production. The quality gate above runs them on
  # SQLite so that it needs no services; this job catches anything the two databases disagree about.
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CURVERISK_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: API tests on PostgreSQL
        run: dotnet test --project tests/CurveRisk.Api.Tests/CurveRisk.Api.Tests.csproj 2>&1 | tee test.log

      # Failed tests become annotations on the run, so the cause is visible without opening the log.
      - name: Report failed tests
        if: failure()
        run: |
          grep -E "^failed |Assert\.|Expected:|Actual:|Exception" test.log | head -40 | while IFS= read -r line; do
            echo "::error title=PostgreSQL test::${line}"
          done

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Each finding becomes an annotation on the run, and the job fails with actionlint's own exit
      # code. Only stdout is captured: docker writes its image-pull progress to stderr.
      - name: actionlint
        run: |
          status=0
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.9 -oneline > lint.txt || status=$?
          while IFS= read -r finding; do
            echo "::error title=actionlint::${finding}"
          done < lint.txt
          exit "$status"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
