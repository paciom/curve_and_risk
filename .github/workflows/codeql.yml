name: codeql

# Static application security testing. Findings appear under the repository's Security tab and
# block the pull request when the repository's code-scanning rule is set to required.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}

      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build CurveRisk.slnx

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
