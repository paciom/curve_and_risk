name: scorecard

# OpenSSF Scorecard: an external, automated assessment of the repository's supply-chain practices
# (pinned dependencies, branch protection, token permissions, code review, SAST, and more).
# Results appear in the Security tab and on the public scorecard for the repository.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2"

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: results.sarif
